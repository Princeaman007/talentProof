services:
  # Backend API Service
  - type: web
    name: talentproof-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REDIS_URL
        sync: false
    healthCheckPath: /api/health

# Frontend must be created as a separate Static Site on Render Dashboard
# Configuration for manual setup:
#   - Type: Static Site
#   - Root Directory: client
#   - Build Command: bash build.sh
#   - Publish Directory: dist
#   - Environment Variables:
#     - VITE_API_URL=https://talentproof.onrender.com/api
#     - VITE_SERVER_URL=https://talentproof.onrender.com
